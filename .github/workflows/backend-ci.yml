name: Backend CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sfera-gamification-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sfera-gamification-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      working-directory: sfera-gamification-backend
      run: mvn clean package -DskipTests

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sfera-backend-jar
        path: sfera-gamification-backend/target/sfera-gamification-backend-0.0.1-SNAPSHOT.jar
        retention-days: 7

