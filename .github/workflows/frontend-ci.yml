name: Frontend CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sfera-gamification-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sfera-gamification-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: sfera-gamification-frontend/package-lock.json

    - name: Install Dependencies
      working-directory: sfera-gamification-frontend
      run: npm ci

    - name: Build Application
      working-directory: sfera-gamification-frontend
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sfera-frontend-dist
        path: sfera-gamification-frontend/dist/
        retention-days: 7

